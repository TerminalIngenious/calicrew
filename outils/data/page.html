<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaliCrew — Données</title>
<style>
  /* Les tons de l'app, pour ne pas avoir l'impression de changer d'outil. */
  :root {
    --bg: #0b0b14;
    --carte: #16161f;
    --bord: #26263a;
    --texte: #f2f2f7;
    --gris: #8a8a9e;
    --accent: #b6ff00;
    --alerte: #f59e0b;
    --rouge: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--texte);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .page { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  .maj { font-size: 0.8rem; color: var(--gris); }
  button {
    margin-left: auto; padding: 0.45rem 0.9rem;
    border: 1px solid var(--bord); border-radius: 8px;
    background: transparent; color: var(--texte);
    font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  h2 {
    margin: 2rem 0 0.75rem; font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; color: var(--gris);
  }
  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; }
  .tuile { padding: 1rem 1.1rem; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte); }
  .tuile .v { display: block; font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tuile .l { display: block; margin-top: 0.15rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gris); }
  .tuile .s { display: block; margin-top: 0.3rem; font-size: 0.78rem; color: var(--accent); }
  /* Le tableau des membres a neuf colonnes : sur une fenêtre étroite il
     déborde, et mieux vaut le faire défiler que tronquer la dernière. */
  .bloc { padding: 1rem; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte); overflow-x: auto; }
  /* Seul le tableau des membres impose une largeur : les autres ont trois
     colonnes et tiennent dans une demi-page. */
  .bloc.large table { min-width: 620px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    padding: 0.5rem 0.6rem; text-align: left; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px; color: var(--gris);
    border-bottom: 1px solid var(--bord); cursor: pointer; user-select: none;
  }
  th:hover { color: var(--accent); }
  td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.muet { opacity: 0.45; }
  .sous { display: block; font-size: 0.72rem; color: var(--gris); }
  .puce { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 99px; font-size: 0.68rem; font-weight: 700; }
  .puce.alerte { background: rgba(245,158,11,0.15); color: var(--alerte); }
  .puce.ok { background: rgba(182,255,0,0.12); color: var(--accent); }
  code { font-size: 0.72rem; color: var(--gris); user-select: all; }
  .barre-piste { display: block; height: 9px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .barre-plein { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .vide { color: var(--gris); font-size: 0.85rem; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 780px) { .deux { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>CaliCrew</h1>
    <span class="maj" id="maj">chargement…</span>
    <button id="recharger">Recharger</button>
  </header>
  <div id="corps"><p class="vide">Lecture de la base…</p></div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const nb = (n) => (n ?? 0).toLocaleString('fr-FR');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function heures(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.round((sec % 3600) / 60);
  return h > 0 ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;
}

function depuis(t) {
  if (!t) return 'jamais';
  const j = Math.floor((Date.now() - t) / 86400000);
  if (j <= 0) return "aujourd'hui";
  if (j === 1) return 'hier';
  return `il y a ${j} j`;
}

const date = (t) => (t ? new Date(t).toLocaleDateString('fr-FR') : '—');

/**
 * Un histogramme en SVG, sans bibliothèque.
 *
 * Le viewBox fait la mise à l'échelle : la hauteur des barres est calculée
 * dans un repère de 100, et le SVG s'étire à la largeur disponible.
 */
function histogramme(donnees, cleValeur, cleLabel, unLabelSur = 1) {
  const maxi = Math.max(1, ...donnees.map((d) => d[cleValeur]));
  const largeur = 100 / donnees.length;
  const barres = donnees.map((d, i) => {
    const h = (d[cleValeur] / maxi) * 82;
    const x = i * largeur;
    const titre = `${d[cleLabel]} — ${d[cleValeur]}`;
    return `<rect x="${x + largeur * 0.15}" y="${88 - h}" width="${largeur * 0.7}" height="${Math.max(h, d[cleValeur] ? 0.8 : 0)}"
      rx="0.6" fill="var(--accent)"><title>${esc(titre)}</title></rect>` +
      (i % unLabelSur === 0
        ? `<text x="${x + largeur / 2}" y="97" font-size="3" fill="#8a8a9e" text-anchor="middle">${esc(d[cleLabel])}</text>`
        : '');
  }).join('');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:170px">
    <line x1="0" y1="88" x2="100" y2="88" stroke="#26263a" stroke-width="0.3"/>
    ${barres}
    <text x="0.5" y="6" font-size="3.4" fill="#8a8a9e">max ${maxi}</text>
  </svg>`;
}

function tuile(v, l, s) {
  return `<div class="tuile"><span class="v">${v}</span><span class="l">${esc(l)}</span>${s ? `<span class="s">${esc(s)}</span>` : ''}</div>`;
}

let stats = null;
let triMembres = { cle: 'derniere', sens: -1 };

function rendu() {
  const s = stats;
  const part = Math.round((s.actifs30 / Math.max(1, s.inscrits)) * 100);

  const membres = [...s.membres].sort((a, b) => {
    const [x, y] = [a[triMembres.cle], b[triMembres.cle]];
    if (typeof x === 'string') return triMembres.sens * x.localeCompare(y);
    return triMembres.sens * ((x || 0) - (y || 0));
  });

  const maxiExo = Math.max(1, ...s.topExercices.map((e) => e.seances));

  $('corps').innerHTML = `
    <div class="tuiles">
      ${tuile(nb(s.inscrits), 'Inscrits', `+${s.inscrits7} cette semaine`)}
      ${tuile(nb(s.actifs7), 'Actifs sur 7 j', `${s.actifsJour} aujourd'hui`)}
      ${tuile(nb(s.seances7), 'Séances sur 7 j', `${s.seancesJour} aujourd'hui`)}
      ${tuile(part + ' %', 'Actifs sur 30 j', `${s.actifs30} / ${s.inscrits} inscrits`)}
    </div>

    <h2>Séances par jour, 30 derniers jours</h2>
    <div class="bloc">${histogramme(s.parJour, 'seances', 'jour', 3)}</div>

    <div class="deux">
      <div>
        <h2>Par semaine, 12 dernières</h2>
        <div class="bloc">${histogramme(s.parSemaine, 'seances', 'semaine', 2)}</div>
      </div>
      <div>
        <h2>Heure de la journée</h2>
        <div class="bloc">${histogramme(s.parHeure.map((h) => ({ ...h, l: h.heure + 'h' })), 'seances', 'l', 3)}</div>
      </div>
    </div>

    <div class="deux">
      <div>
        <h2>Jour de la semaine</h2>
        <div class="bloc">${histogramme(s.parJourSemaine.map((j) => ({ ...j, l: j.nom.slice(0, 3) })), 'seances', 'l')}</div>
      </div>
      <div>
        <h2>Depuis le début</h2>
        <div class="tuiles">
          ${tuile(nb(s.seancesTotal), 'Séances')}
          ${tuile(nb(s.repsTotal), 'Reps')}
          ${tuile(heures(s.dureeTotal), 'Temps cumulé')}
          ${tuile(nb(s.seances30), 'Séances sur 30 j')}
        </div>
      </div>
    </div>

    <h2>Alertes</h2>
    <div class="bloc">
      ${bloc('Séances d’une durée impossible', s.aberrantes, (a) =>
        `<tr><td>${esc(a.nom)}<span class="sous">${esc(a.date)}</span></td>
         <td class="n"><span class="puce alerte">${a.heures} h</span></td>
         <td class="n"><code>${esc(a.id)}</code></td></tr>`,
        'Personne n’a oublié de terminer une séance.')}
      ${bloc('Inscrits sans aucune séance', s.fantomes, (m) =>
        `<tr><td>${esc(m.nom)}<span class="sous">${esc(m.email)}</span></td>
         <td class="n">inscrit ${date(m.inscrit)}</td><td></td></tr>`,
        'Tout le monde a essayé au moins une fois.')}
      ${bloc('Comptes dans aucun groupe', s.horsGroupe, (m) =>
        `<tr><td>${esc(m.nom)}<span class="sous">${esc(m.email)}</span></td>
         <td class="n">${m.seances} séance${m.seances > 1 ? 's' : ''}</td>
         <td class="n">${esc(depuis(m.derniere))}</td></tr>`,
        'Tout le monde est rattaché à un groupe.')}
      ${bloc('Endormis depuis plus de 14 jours', s.endormis, (m) =>
        `<tr><td>${esc(m.nom)}<span class="sous">${esc(m.groupes.join(', ') || 'aucun groupe')}</span></td>
         <td class="n">${m.seances} séances</td>
         <td class="n">${esc(depuis(m.derniere))}</td></tr>`,
        'Personne n’a décroché.')}
    </div>

    <h2>Les membres</h2>
    <div class="bloc large">
      <table>
        <thead><tr>
          ${enTete('nom', 'Membre')}
          ${enTete('seances', 'Séances')}
          ${enTete('seances7', '7 j')}
          ${enTete('reps', 'Reps')}
          ${enTete('duree', 'Temps')}
          ${enTete('xp', 'XP')}
          ${enTete('cartes', 'Cartes')}
          ${enTete('derniere', 'Dernière')}
          ${enTete('inscrit', 'Inscrit')}
        </tr></thead>
        <tbody>
          ${membres.map((m) => `
            <tr class="${m.seances === 0 ? 'muet' : ''}">
              <td>${esc(m.nom)}<span class="sous">${esc(m.groupes.join(', ') || 'aucun groupe')}</span></td>
              <td class="n">${m.seances}</td>
              <td class="n">${m.seances7 || ''}</td>
              <td class="n">${nb(m.reps)}</td>
              <td class="n">${heures(m.duree)}</td>
              <td class="n">${nb(m.xp)}</td>
              <td class="n">${m.cartes}</td>
              <td class="n">${esc(depuis(m.derniere))}</td>
              <td class="n">${date(m.inscrit)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="deux">
      <div>
        <h2>Exercices les plus faits</h2>
        <div class="bloc">
          <table><tbody>
            ${s.topExercices.map((e) => `
              <tr>
                <td style="width:38%">${esc(e.nom)}</td>
                <td><span class="barre-piste"><span class="barre-plein" style="width:${(e.seances / maxiExo) * 100}%"></span></span></td>
                <td class="n" style="width:4rem">${e.seances}</td>
              </tr>`).join('')}
          </tbody></table>
        </div>
      </div>
      <div>
        <h2>Groupes</h2>
        <div class="bloc">
          <table>
            <thead><tr><th>Nom</th><th>Membres</th><th>Créé par</th></tr></thead>
            <tbody>
              ${s.groupes.map((g) => `
                <tr>
                  <td>${esc(g.nom)}<span class="sous">code ${esc(g.code)}</span></td>
                  <td class="n">${g.membres}${g.enAttente ? ` <span class="puce alerte">+${g.enAttente}</span>` : ''}</td>
                  <td class="n">${esc(g.createur)}<span class="sous">${date(g.cree)}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  for (const th of document.querySelectorAll('th[data-cle]')) {
    th.onclick = () => {
      const cle = th.dataset.cle;
      triMembres = { cle, sens: triMembres.cle === cle ? -triMembres.sens : -1 };
      rendu();
    };
  }
}

function enTete(cle, label) {
  const fleche = triMembres.cle === cle ? (triMembres.sens === -1 ? ' ↓' : ' ↑') : '';
  return `<th data-cle="${cle}">${esc(label)}${fleche}</th>`;
}

function bloc(titre, lignes, ligne, siVide) {
  if (!lignes.length) {
    return `<p class="vide"><span class="puce ok">OK</span> ${esc(titre)} — ${esc(siVide)}</p>`;
  }
  return `<p class="vide"><span class="puce alerte">${lignes.length}</span> ${esc(titre)}</p>
    <table><tbody>${lignes.map(ligne).join('')}</tbody></table>`;
}

async function charge() {
  $('maj').textContent = 'lecture…';
  try {
    const r = await fetch('/api/stats');
    stats = await r.json();
    if (stats.erreur) throw new Error(stats.erreur);
    $('maj').textContent = 'à jour — ' + new Date(stats.genere).toLocaleTimeString('fr-FR');
    rendu();
  } catch (err) {
    $('maj').textContent = 'erreur';
    $('corps').innerHTML = `<p class="vide">Lecture impossible : ${esc(err.message)}</p>`;
  }
}

$('recharger').onclick = charge;
charge();
</script>
</body>
</html>
